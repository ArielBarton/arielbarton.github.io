
<!DOCTYPE html>
<html><head>

<title>Exam timer</title>

<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.3.1/jquery.min.js"></script>

<script>window.MathJax = { tex: { tags: "ams", }, }; </script> 
 <script async='async' id='MathJax-script' src='https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml-full.js' type='text/javascript'></script> 


<style type="text/css">
	body {
		text-align: center;
		color: white;
		background-color: black;
	}
	textarea {
		border-color: #333333;
		background-color: #000000;
		color: #ffffff;
	}
	input {
		border-color: #181818;
		background-color: #333333;
		color: #ffffff;
	}
	p {
		font-family:"Verdana";
	} 
	a:link {
	  color: #505050;
	}
	a:visited {
	  color: #505050;
	}
	
</style>
</head>
<body onLoad='loop()' >
<script>
"use strict"

function pluralize(n, s) { return n + ' ' + (n == 1 ? s : s + 's'); }

function update() {
	var now = new Date(),
		ampm = $("#ampm").val(),
		hourTime0 = Number($("#hours")[0].value),
		hourTime = hourTime0 + (ampm == "am" || (ampm == "pm" && hourTime0 == 12) ? 0 : 12),
		minuteTime = Number($("#minutes")[0].value),
		endExam = new Date();
	endExam.setHours(hourTime, minuteTime);
	var	msecsLeft = endExam - now,
		hoursLeft = Math.floor(msecsLeft / 3600000),
		minutesLeft = Math.floor(msecsLeft / 60000 % 60),
		hourString = pluralize(hoursLeft, 'hour'),
		minuteString = pluralize(minutesLeft, 'minute');
	if (ampm) {
		$("#mathjaxecho").html($('textarea#mathjaxinput').val());
		MathJax.typeset();
		if (msecsLeft < 0) $("#timesentence").html("<b>Time's up!</b>");
		else if (hoursLeft == 0) {
			if (minutesLeft == 0) 
				$("#timesentence").html('You have less than 1 minute remaining.');
			else $("#timesentence").html('You have ' + minuteString + ' remaining.');
		}
		else $("#timesentence")
			.html('You have ' + hourString + ' and ' + minuteString + ' remaining.');
	}
}

function loop() { update(); setTimeout(loop, 10000); }

$(function() {
	$(".updateme").bind("keyup change", update);
	loop();
});
</script>

<form>
<p>Exam ends at: <input id="hours" class="updateme" size="2" maxlength="2" type="text" value="1"> : 
<input id="minutes" class="updateme" size="2" maxlength="2" type="text" value="45">
<select id="ampm" class="updateme">
<option value="pm">PM</option><option value="am">AM</option>
</select></p>
</form>

<p id="timesentence"></p>

<p id="mathjaxecho"></p>



<p style="margin-top: 10cm;"><button onClick='loop()'>Update MathJax</button></p>

<textarea rows="10" cols="50" id="mathjaxinput">
Good luck on your exam!
</textarea>


</body>
</html>
